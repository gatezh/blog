# Bun project configuration. Reference: https://bun.sh/docs/runtime/bunfig
# Loaded automatically by every `bun` invocation in this repo.

[install]
# Enforce exact pins on `bun add` — matches the "pin exact dependency
# versions" rule in .claude/CLAUDE.md. Writes "1.2.3" instead of "^1.2.3".
exact = true

# pnpm-style isolated node_modules. Catches phantom dependencies (importing
# something a workspace never declared). Switch to "hoisted" if a tool
# struggles with the symlink layout.
linker = "isolated"

# Block packages published in the last 7 days — defense against fresh
# malicious uploads, and against same-week regressions. Value is in SECONDS.
# This gate is deliberate: do not raise a pin past it to "catch up".
# A security fix that cannot wait a week bypasses it for that package only,
# for one run: `bun add <pkg>@<version> --minimum-release-age-excludes=<pkg>`.
# The flag replaces the excludes list below for that run.
# (`--minimum-release-age=0` would lift it for every package in the run.)
minimumReleaseAge = 604800
# Except @types/bun and the bun-types it wraps: their version tracks the Bun
# runtime pinned in .mise.toml, and they move together on the day Bun is
# upgraded.
minimumReleaseAgeExcludes = ["@types/bun", "bun-types"]
