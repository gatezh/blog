# Pin runtime and build tools that affect project stability.
# node is provided by the base image — needed for VS Code extensions
# (OXC, Playwright, etc.) that spawn node. Do not add it here.
[tools]
bun = "1.4.4"
hugo-extended = "0.164.0"
# Go is required only to install gotmplfmt below (Go-installed Hugo
# template formatter — gohugoio/gotmplfmt has no linux-arm64 binary
# release, so we build from source).
go = "1.26.10"
"go:github.com/gohugoio/gotmplfmt" = "v0.4.1"
# Lints .github/workflows (`bun run lint:actions`, part of `bun run check`).
# The upstream tool by its aqua backend: mise's `actionlint` shorthand is
# deprecated in favour of a fork. .github/actionlint.yaml lists what this
# version does not know yet.
"aqua:rhysd/actionlint" = "1.7.12"
# actionlint runs the first shellcheck on PATH over every `run:` block. Pinned
# so CI and the devcontainer lint alike: the runner image's own copy (0.9.0
# on ubuntu-24.04) reported SC2015 where the devcontainer's 0.11.0 did not.
"aqua:koalaman/shellcheck" = "0.11.0"
