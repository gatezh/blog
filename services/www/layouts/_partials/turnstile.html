{{/* Cloudflare Turnstile - lazy load when contact section approaches viewport.
     See js/turnstile.ts; the site key is passed as data-site-key. */}}
{{ with .Site.Params.turnstileSiteKey }}
	{{ $siteKey := . }}
	{{ with partial "js.html" "js/turnstile.ts" }}
		<script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" crossorigin="anonymous" defer data-site-key="{{ $siteKey }}"></script>
	{{ end }}
{{ end }}
