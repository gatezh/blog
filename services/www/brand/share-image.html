<!doctype html>
<!--
  Source for the site-wide share image, assets/brand/share.png (1200 × 630).
  Render it with `bun run brand` from services/www after changing this file;
  never edit the PNG by hand.

  Light theme tokens from themes/terminal/assets/css/main.css, and the site's
  own self-hosted JetBrains Mono, so the card matches the pages it links to.
  The copy is the gatezh.com variant of the positioning statement (About
  tagline and role); change it there first, then here.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 400 800;
        src: url("../static/fonts/jetbrains-mono-latin.woff2") format("woff2");
      }

      :root {
        --bg: #f5f5f0;
        --fg: #1a1a1a;
        --accent: #16a34a;
        --muted: #595e66;
        --border: #d1d5db;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: 76px 84px 60px;
        background: var(--bg);
        color: var(--fg);
        font-family: "JetBrains Mono", monospace;
        -webkit-font-smoothing: antialiased;
      }

      .accent {
        color: var(--accent);
      }

      main {
        flex: 1;
      }

      h1 {
        font-size: 108px;
        font-weight: 800;
        letter-spacing: -4px;
        line-height: 1;
      }

      .role {
        margin: 24px 0 38px;
        font-size: 38px;
        font-weight: 600;
      }

      .cursor {
        display: inline-block;
        width: 0.55em;
        height: 0.95em;
        margin-left: 6px;
        vertical-align: -0.1em;
        background: var(--accent);
      }

      .tagline {
        max-width: 960px;
        padding-left: 26px;
        border-left: 6px solid var(--accent);
        font-size: 33px;
        line-height: 1.45;
      }

      footer {
        display: flex;
        justify-content: space-between;
        padding-top: 24px;
        border-top: 2px solid var(--border);
        color: var(--muted);
        font-size: 25px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Serge Gatezh<span class="accent">.</span></h1>
      <p class="role">
        <span class="accent">&gt;</span> Product Engineer<span class="cursor"></span>
      </p>
      <p class="tagline">I turn messy business processes into simple, secure software.</p>
    </main>
    <footer>
      <span><span class="accent">~/</span>gatezh.com</span>
      <span>Calgary, Canada</span>
    </footer>
  </body>
</html>
