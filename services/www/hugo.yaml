baseURL: https://gatezh.com/
locale: en-US
title: Serge Gatezh
theme: terminal
enableRobotsTXT: true

# Makes .Lastmod (and so <lastmod> in the sitemap) the git author date of the
# last commit touching each page, instead of the `date` front matter. Without
# it, editing a post sends search engines no freshness signal at all. Requires
# full history in CI — the deploy workflow checks out with fetch-depth: 0.
enableGitInfo: true

# Hugo emits a /page/1/ alias for every paginated list — a meta-refresh stub
# whose only content is a canonical back to the list page. Nothing links them,
# so they exist purely to be crawled and filed as "Alternate page with proper
# canonical tag". There is no pager to reach page 1 from, so nothing is lost.
pagination:
  disableAliases: true

# Output formats for llms.txt and agent-friendly Markdown.
#
# There is deliberately no `mediaTypes:` block. Hugo's built-in text/markdown
# already covers md, markdown AND mdown, and redefining a media type REPLACES
# it rather than extending it — narrowing the suffix list to ["md"] makes Hugo
# stop recognising this site's four `.markdown` posts as content. The build
# stays green and the sitemap simply shrinks, so nothing catches it except
# tests/agents.spec.ts. text/plain -> txt is likewise already a default.
outputFormats:
  # Plain-text format behind content/llms.md and content/llms-full.md,
  # which set `url:` to emit /llms.txt and /llms-full.txt.
  LLMText:
    mediaType: text/plain
    isPlainText: true
    notAlternative: true
  # Hugo ships a `markdown` format already (baseName index, isPlainText true,
  # mediaType text/markdown). Only `notAlternative` differs: agents reach these
  # by direct URL or Accept negotiation, so the <link rel="alternate"> tags are
  # noise in every page's <head>.
  markdown:
    notAlternative: true

# `page` alone covers only kind "page". The home page and section lists are
# kinds "home" and "section" and inherit nothing from it, so scoping the mirror
# to `page` leaves `/` — the URL an agent is most likely to try first — serving
# HTML to an Accept: text/markdown request. Listing a kind REPLACES its
# defaults, so HTML and RSS have to be repeated.
outputs:
  home: [HTML, RSS, Markdown]
  section: [HTML, RSS, Markdown]
  page: [HTML, Markdown]

# Hugo v0.161+ runs Node tools (Tailwind) under `node --permission`, defaulting
# allowRead to ["."] — the Hugo project root, services/www. This is a bun
# monorepo with node_modules hoisted one directory above, and Hugo passes
# allowRead straight through to Node's --allow-fs-read, which requires absolute
# paths; relative entries like ".." silently no-op. "*" is the documented escape
# hatch for monorepos that hoist dependencies outside the Hugo project root.
security:
  node:
    permissions:
      allowRead:
        - "*"

# Build configuration for Tailwind CSS v4
build:
  buildStats:
    enable: true

services:
  googleAnalytics:
    id: G-96MLGN850Y

permalinks:
  posts: "/posts/:contentbasename/"

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: ever-learning
      name: Ever Learning
      url: /ever-learning/
      weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 30
    - identifier: contact
      name: Contact
      url: /contact/
      weight: 40

params:
  description: "Personal blog of Serge Gatezh, a Full Stack Developer in Calgary. Posts about building clear, dependable web products, security, infrastructure, and software engineering."
  author: "Serge Gatezh"
  keywords: "Serge Gatezh, full stack developer, web development, React, TypeScript, security, Calgary"

  comments: true

  # Contact form configuration
  # Turnstile site key (public, safe to commit)
  # Get from Cloudflare Dashboard > Turnstile
  turnstileSiteKey: "0x4AAAAAACUaMne4Sn7WV9Yo"
  # Worker URL - set after deploying the API Worker
  # Example: https://gatezh-com-email-worker.<subdomain>.workers.dev
  contactWorkerUrl: "https://gatezh-com-email-worker.gatezh.workers.dev"

  profileMode:
    enabled: true
    title: "Serge Gatezh"
    subtitle: "Full Stack Developer"

  socialIcons:
    - name: "GitHub"
      url: "https://github.com/gatezh"
    - name: "Linkedin"
      url: "https://linkedin.com/in/gatezh"
