name: Upstream

# Once a month, brings /upstream/ up to date with GitHub: a pull request with
# a stub for each issue or pull request filed on someone else's repository
# since, and the close date of each entry closed since. A stub has an empty
# `note`, which fails the Hugo build until the line is written, so a stub
# cannot ship unread. See services/www/scripts/upstream-sync.ts.
#
# 09:00 UTC is 03:00 in Alberta (UTC-6 all year). The job's token sees only
# public repositories, so nothing private can reach a stub. A pull request
# opened with it does not trigger ci.yml; CI runs on the commit that writes
# the notes.
on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Pushing over an open sync PR would discard notes written on it; the
      # first run after it merges picks up anything skipped.
      - name: Check for last month's pull request
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head upstream-sync --json url --jq '.[].url')
          if [ -n "$pr" ]; then
            echo "Last month's pull request is still open: $pr. Merge or close it, and the next run picks up from there." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.previous.outputs.pr == ''
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        if: steps.previous.outputs.pr == ''

      - name: Update the page
        if: steps.previous.outputs.pr == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run --cwd services/www upstream:sync | tee "$RUNNER_TEMP/summary.md"

      # No PR is open, so a leftover upstream-sync branch is safe to overwrite.
      - name: Open a pull request
        if: steps.previous.outputs.pr == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Nothing to add."
            exit 0
          fi
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c upstream-sync
          git commit -qam "content: upstream entries, $(date -u +'%B %Y')"
          git push -qf origin upstream-sync
          gh pr create --head upstream-sync --title "content: upstream entries, $(date -u +'%B %Y')" --body-file "$RUNNER_TEMP/summary.md"

  # Community keepalive against the 60-day schedule disable (not documented
  # by GitHub). A separate job so only it holds `actions: write`.
  keepalive:
    name: Keep the schedule alive
    needs: sync
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/upstream.yml/enable"
