name: CI

on:
  # No `branches:` filter — a stacked PR targets the branch below it in the
  # stack, not master, and a filter here would silently skip CI on every PR
  # except the base one.
  pull_request:
    types: [opened, synchronize, reopened]
  # deploy-staging.yml and release.yml run this whole workflow on the commit
  # they are about to ship, so nothing deploys without the checks and tests a
  # pull request runs.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its older run. head_ref is empty when
# another workflow calls this one; run_id (the caller's run) then gives each
# deploy's CI a group of its own, so one deploy never cancels another's.
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Names the tree this pull request run tests, so deploy-staging.yml's
      # preflight can skip CI for a merge commit with the same tree.
      - name: Record the tested tree
        if: github.event_name == 'pull_request'
        run: |
          echo "TESTED_TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
          echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > "$RUNNER_TEMP/tested-tree.txt"

      - name: Upload the tested-tree marker
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-tree-${{ env.TESTED_TREE }}
          path: ${{ runner.temp }}/tested-tree.txt
          # A re-run uploads it again.
          overwrite: true
          # Once expired, the deploy just runs CI.
          retention-days: 30

      - uses: $/.github/actions/setup

      # `check` is lint + actionlint + format + hugo-format + typecheck +
      # build. The production build runs here, which is why there is no
      # separate build job — adding one back would build the site twice per
      # PR. actionlint also runs shellcheck (preinstalled on the runner) on
      # every `run:` block.
      - name: Check
        run: bun run check

  test-browser:
    name: Test (Browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      # Not cached: Playwright's CI docs advise against caching browsers, the
      # system dependencies have to be installed on every run anyway, and a
      # per-PR cache entry of a few hundred MB fills the repository's quota.
      # Every project in playwright.config.ts runs headless Chromium, which is
      # the headless shell, so the full Chromium build is not downloaded.
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Run browser tests
        run: bun run test
