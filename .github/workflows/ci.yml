name: CI

on:
  # No `branches:` filter — a stacked PR targets the branch below it in the
  # stack, not master, and a filter here would silently skip CI on every PR
  # except the base one.
  pull_request:
    types: [opened, synchronize, reopened]
  # deploy-staging.yml and release.yml run this whole workflow on the commit
  # they are about to ship, so nothing deploys without the checks and tests a
  # pull request runs.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its older run. head_ref is empty when
# another workflow calls this one; run_id (the caller's run) then gives each
# deploy's CI a group of its own, so one deploy never cancels another's.
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      # `check` is lint + format + hugo-format + typecheck + build. The
      # production build runs here, which is why there is no separate build
      # job — adding one back would build the site twice per PR.
      - name: Check
        run: bun run check

  test-browser:
    name: Test (Browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      # Not cached: Playwright's CI docs advise against caching browsers, the
      # system dependencies have to be installed on every run anyway, and a
      # per-PR cache entry of a few hundred MB fills the repository's quota.
      # Every project in playwright.config.ts runs headless Chromium, which is
      # the headless shell, so the full Chromium build is not downloaded.
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Run browser tests
        run: bun run test
