name: CI

on:
  # No `branches:` filter — a stacked PR targets the branch below it in the
  # stack, not master, and a filter here would silently skip CI on every PR
  # except the base one.
  pull_request:
    types: [opened, synchronize, reopened]
  # deploy-staging.yml and release.yml run this whole workflow on the commit
  # they are about to ship, so nothing deploys without the checks and tests a
  # pull request runs.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its older run. head_ref is empty when
# another workflow calls this one; run_id (the caller's run) then gives each
# deploy's CI a group of its own, so one deploy never cancels another's.
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      # `check` is lint + format + hugo-format + typecheck + build. The
      # production build runs here, which is why there is no separate build
      # job — adding one back would build the site twice per PR.
      - name: Check
        run: bun run check

  test-browser:
    name: Test (Browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Extract Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(node -e "const pkg = require('./package.json'); console.log(pkg.devDependencies['@playwright/test'])")
          if [ -z "$PLAYWRIGHT_VERSION" ] || [ "$PLAYWRIGHT_VERSION" = "undefined" ]; then
            echo "::error::Failed to extract Playwright version from package.json"
            exit 1
          fi
          echo "version=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        working-directory: services/www
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        working-directory: services/www
        run: npx playwright install-deps chromium

      - name: Run browser tests
        run: bun run test
