name: Release

# Production deploys are manual and tag-anchored. Every release is a tag you can
# point at, and a redeploy of an existing tag is a first-class action rather than
# a revert commit.
#
# NOTE: this deploys under the CURRENT Worker names (gatezh-com,
# gatezh-com-email-worker) using the top-level wrangler config. There is
# deliberately no `production` env block — adding one renames the deployed
# Workers and orphans the live ones. See the cutover runbook in
# docs/deployment.md.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Create a new release, or redeploy an existing tag
        type: choice
        options: [create, redeploy]
        default: create
      bump:
        description: Version bump (create only)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Existing version to redeploy, e.g. v1.4.2 (redeploy only)
        type: string
        required: false

permissions:
  contents: write

concurrency:
  # Production deploys queue rather than cancel each other: a cancelled deploy
  # can leave www and api on different commits.
  group: deploy-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ inputs.action }}
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${ACTION}" = "redeploy" ]; then
            [ -n "${VERSION}" ] || { echo "::error::redeploy requires a version"; exit 1; }
            git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null \
              || { echo "::error::tag ${VERSION} does not exist"; exit 1; }
            echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"

          case "${BUMP}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          next="${major}.${minor}.${patch}"
          echo "Releasing v${next} (previous: ${latest})"
          gh release create "v${next}" --generate-notes --target "${GITHUB_SHA}"
          echo "version=${next}" >> "$GITHUB_OUTPUT"

  check:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            services/*/node_modules
          key: node-modules-${{ hashFiles('.mise.toml', 'bun.lock', 'bunfig.toml') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
      - name: Check
        run: bun run check

  deploy-www:
    needs: [release, check]
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://gatezh.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          # See the note in deploy-staging.yml: a shallow clone collapses every
          # <lastmod> to the checkout's own commit date.
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            services/*/node_modules
          key: node-modules-${{ hashFiles('.mise.toml', 'bun.lock', 'bunfig.toml') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Build Hugo site
        env:
          HUGO_PARAMS_BUILDCOMMIT: ${{ github.sha }}
          # Production is the only place a PostHog key is plumbed in at all.
          HUGO_PARAMS_POSTHOGKEY: ${{ vars.POSTHOG_KEY }}
        run: bun run --cwd services/www build

      - name: Deploy www
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/www
          packageManager: bun

  deploy-api:
    needs: [release, check]
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://gatezh.com/contact/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            services/*/node_modules
          key: node-modules-${{ hashFiles('.mise.toml', 'bun.lock', 'bunfig.toml') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Deploy api
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/api
          packageManager: bun
          secrets: |
            ${{ secrets.RESEND_API_KEY != '' && 'RESEND_API_KEY' || '' }}
            ${{ secrets.TURNSTILE_SECRET_KEY != '' && 'TURNSTILE_SECRET_KEY' || '' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

  verify:
    needs: [release, deploy-www, deploy-api]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify production
        run: |
          fetch() {
            curl -sf --max-time 20 "$1" || { echo "::error::fetch failed: $1"; exit 1; }
          }

          sleep 5
          home=$(fetch https://gatezh.com/)

          deployed=$(printf '%s' "${home}" | grep -o 'build-commit[^>]*' | grep -oE '[0-9a-f]{40}' | head -1)
          if [ "${deployed}" != "${GITHUB_SHA}" ]; then
            echo "::error::Deployed build-commit '${deployed}' does not match ${GITHUB_SHA}"
            exit 1
          fi

          echo "## Release v${{ needs.release.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed \`${deployed}\` to https://gatezh.com" >> "$GITHUB_STEP_SUMMARY"
