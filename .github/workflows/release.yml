name: Release
run-name: "${{ inputs.action == 'create' && format('Release ({0})', inputs.bump) || format('Redeploy {0}', inputs.version) }}"

# Production deploys are manual and tag-anchored. Every release is a tag you can
# point at, and a redeploy of an existing tag is a first-class action rather than
# a revert commit. For an instant rollback without a rebuild, see "Rolling back"
# in docs/deployment.md.
#
# NOTE: this deploys under the CURRENT Worker names (gatezh-com,
# gatezh-com-email-worker) using the top-level wrangler config. There is
# deliberately no `production` env block — adding one renames the deployed
# Workers and orphans the live ones. See "Remaining: rename the Workers" in
# docs/deployment.md.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Create a new release, or redeploy an existing tag
        type: choice
        options: [create, redeploy]
        default: create
      bump:
        description: Version bump (create only)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Existing version to redeploy, e.g. 1.4.2 (redeploy only)
        type: string
        required: false

# Read-only by default. Only the release job writes (it creates the tag and the
# GitHub release); the jobs that run bun install, the build and the deploy
# actions never hold a token that could push.
permissions:
  contents: read

concurrency:
  # A running production deploy is never cancelled: that can leave www and api
  # on different commits. `queue: max` because by default GitHub keeps only one
  # pending run and replaces it when the next arrives, and every dispatch here
  # is deliberate (a release or a redeploy of a chosen tag).
  group: deploy-production
  cancel-in-progress: false
  queue: max

# An explicit `bash` runs `bash -eo pipefail`; the implicit default is
# `bash -e` alone, which lets a failed curl hide behind a later pipe stage.
defaults:
  run:
    shell: bash

jobs:
  # The whole of CI on the commit about to be tagged, before anything is
  # tagged — a failure leaves no release behind. Not on a redeploy: that tag
  # passed CI when it was released, and a rollback mid-incident must not wait on
  # a flaky test or a newer ci.yml the old tree cannot satisfy.
  ci:
    if: inputs.action == 'create'
    uses: $/.github/workflows/ci.yml

  release:
    needs: ci
    # Only a run from master may tag: the production environment refuses the
    # deploy jobs on any other ref, which would leave a release that was never
    # deployed. `!failure() && !cancelled()` lets it run when ci was skipped (a
    # redeploy) but not when it failed.
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ inputs.action }}
          BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${ACTION}" = "redeploy" ]; then
            version="${INPUT_VERSION#v}"
            [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "::error::version must look like 1.4.2, got '${INPUT_VERSION}'"; exit 1; }
            sha=$(git rev-parse -q --verify "refs/tags/v${version}^{commit}") \
              || { echo "::error::tag v${version} does not exist"; exit 1; }
            # A tag can point anywhere; production only ships commits on master.
            git merge-base --is-ancestor "${sha}" HEAD \
              || { echo "::error::v${version} (${sha}) is not on master"; exit 1; }
            echo "Redeploying v${version} (${sha})"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "commit_sha=${sha}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # "Re-run all jobs" runs this again on the same commit. If the first
          # attempt already tagged it, deploy that release rather than bumping
          # and tagging the commit a second time. Release tags only; anything
          # else starting with "v" is ignored.
          if [ "${GITHUB_RUN_ATTEMPT}" -gt 1 ]; then
            existing=$(git tag --points-at "${GITHUB_SHA}" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            if [ -n "${existing}" ]; then
              echo "Re-run: ${existing} already points at ${GITHUB_SHA}; deploying it again"
              echo "version=${existing#v}" >> "$GITHUB_OUTPUT"
              echo "commit_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          latest=$(git tag -l --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"

          case "${BUMP}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          next="${major}.${minor}.${patch}"
          echo "Releasing v${next} at ${GITHUB_SHA} (previous: ${latest})"
          gh release create "v${next}" --generate-notes --target "${GITHUB_SHA}"
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  # Production changes in two phases. The upload jobs build each service and
  # upload it as a new Worker version that serves no traffic. Only when BOTH
  # uploads succeed does `promote` switch both Workers to them. A failed upload
  # leaves production exactly as it was.
  # https://developers.cloudflare.com/workers/configuration/versions-and-deployments/
  #
  # Wrangler runs directly, not through cloudflare/wrangler-action: the action
  # only adds `--var` to commands that start with `deploy`, and the version id
  # comes from Wrangler's own machine-readable output (WRANGLER_OUTPUT_FILE_PATH).
  # `--env=""` names the top-level config explicitly: production has no env
  # block (see the NOTE at the top).
  upload-www:
    needs: release
    # Stated outright: only the release job's result matters here, not that
    # ci was skipped on a redeploy.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Variables and secrets only. The Deployments record belongs to `promote`,
    # the job that actually changes what production serves.
    environment:
      name: production
      deployment: false
    outputs:
      version_id: ${{ steps.upload.outputs.version_id }}
      previous: ${{ steps.upload.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.commit_sha }}
          # See the note in deploy-staging.yml: a shallow clone collapses every
          # <lastmod> to the checkout's own commit date.
          fetch-depth: 0
      - uses: $/.github/actions/setup

      - name: Build Hugo site
        env:
          HUGO_BASEURL: ${{ vars.HUGO_BASEURL }}
          HUGO_PARAMS_APIURL: ${{ vars.HUGO_PARAMS_APIURL }}
          HUGO_PARAMS_TURNSTILESITEKEY: ${{ vars.HUGO_PARAMS_TURNSTILESITEKEY }}
          # Production only. deploy-staging.yml deliberately has no equivalent
          # line, so a key set on staging by mistake still never reaches a build.
          # Optional: unset means the site ships without PostHog.
          HUGO_PARAMS_POSTHOGKEY: ${{ vars.HUGO_PARAMS_POSTHOGKEY }}
          # The tag's commit, not github.sha: on a redeploy those differ, and
          # the verify job must confirm the tag is what is live.
          HUGO_PARAMS_BUILDCOMMIT: ${{ needs.release.outputs.commit_sha }}
        run: |
          : "${HUGO_BASEURL:?Set HUGO_BASEURL on the production environment}"
          bun run --cwd services/www build

      - name: Upload www as a new version
        id: upload
        working-directory: services/www
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
          VERSION: ${{ needs.release.outputs.version }}
          COMMIT_SHA: ${{ needs.release.outputs.commit_sha }}
        run: |
          # What production serves now, as version specs (id@percentage), for
          # the command rollback-command prints if promote or verify fails.
          previous=$(bunx wrangler deployments status --env="" --json | jq -r '[.versions[] | "\(.version_id)@\(.percentage)%"] | join(" ")')
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          # The release tag on the version maps it to its release in the
          # dashboard (docs/deployment.md, "Rolling back").
          bunx wrangler versions upload --env="" --tag "v${VERSION}" --message "${COMMIT_SHA}"
          id=$(jq -r 'select(.type == "version-upload") | .version_id' "${WRANGLER_OUTPUT_FILE_PATH}")
          [ -n "${id}" ] || { echo "::error::wrangler reported no version id"; exit 1; }
          echo "version_id=${id}" >> "$GITHUB_OUTPUT"

      # For promote: `wrangler triggers deploy` reads the whole config and
      # refuses to run unless assets.directory exists, though it uploads
      # nothing from it. Handing over the build it uploaded, rather than an
      # empty stand-in, keeps promote on the exact tree this version came from.
      # `overwrite` lets "Re-run all jobs" replace an earlier attempt's copy.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: www-public
          path: services/www/public
          if-no-files-found: error
          overwrite: true

  upload-api:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      deployment: false
    outputs:
      version_id: ${{ steps.upload.outputs.version_id }}
      previous: ${{ steps.upload.outputs.previous }}
    steps:
      # First, before anything changes. `$/` loads the action from this
      # workflow's own commit, so it needs no checkout.
      - uses: $/.github/actions/check-deploy-config
        with:
          environment: production
        env:
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
          HUGO_PARAMS_APIURL: ${{ vars.HUGO_PARAMS_APIURL }}
          HUGO_PARAMS_TURNSTILESITEKEY: ${{ vars.HUGO_PARAMS_TURNSTILESITEKEY }}
          HAS_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY != '' }}
          HAS_TO_EMAIL: ${{ secrets.TO_EMAIL != '' }}
          HAS_FROM_EMAIL: ${{ secrets.FROM_EMAIL != '' }}
          HAS_TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY != '' }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.commit_sha }}
      - uses: $/.github/actions/setup

      # Secrets go up with the code in one Worker version — see the same step
      # in deploy-staging.yml.
      - name: Write the secrets file
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: |
          umask 077
          jq -n 'env | {RESEND_API_KEY, TURNSTILE_SECRET_KEY, TO_EMAIL, FROM_EMAIL}
            | with_entries(select(.value != null and .value != ""))' > "${RUNNER_TEMP}/secrets.json"

      - name: Upload api as a new version
        id: upload
        working-directory: services/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
          VERSION: ${{ needs.release.outputs.version }}
          COMMIT_SHA: ${{ needs.release.outputs.commit_sha }}
        run: |
          previous=$(bunx wrangler deployments status --env="" --json | jq -r '[.versions[] | "\(.version_id)@\(.percentage)%"] | join(" ")')
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          bunx wrangler versions upload --env="" \
            --secrets-file "${RUNNER_TEMP}/secrets.json" \
            --var "ALLOWED_ORIGIN:${ALLOWED_ORIGIN}" \
            --tag "v${VERSION}" --message "${COMMIT_SHA}"
          id=$(jq -r 'select(.type == "version-upload") | .version_id' "${WRANGLER_OUTPUT_FILE_PATH}")
          [ -n "${id}" ] || { echo "::error::wrangler reported no version id"; exit 1; }
          echo "version_id=${id}" >> "$GITHUB_OUTPUT"

      - name: Delete the secrets file
        if: always()
        run: rm -f "${RUNNER_TEMP}/secrets.json"

  promote:
    needs: [release, upload-www, upload-api]
    if: ${{ !cancelled() && needs.upload-www.result == 'success' && needs.upload-api.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://gatezh.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.commit_sha }}
      - uses: $/.github/actions/setup
      # The build upload-www uploaded — see the note there.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: www-public
          path: services/www/public

      # api first: the new site may post to an api change, never the reverse.
      # A version upload skips triggers (routes, custom domains, workers.dev);
      # `triggers deploy` (experimental) applies them as `wrangler deploy` did.
      - name: Promote both versions to 100% of traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          API_VERSION_ID: ${{ needs.upload-api.outputs.version_id }}
          WWW_VERSION_ID: ${{ needs.upload-www.outputs.version_id }}
          MESSAGE: Release v${{ needs.release.outputs.version }}
        run: |
          bunx wrangler versions deploy --cwd services/api --env="" "${API_VERSION_ID}@100%" --message "${MESSAGE}" --yes
          bunx wrangler triggers deploy --cwd services/api --env=""
          bunx wrangler versions deploy --cwd services/www --env="" "${WWW_VERSION_ID}@100%" --message "${MESSAGE}" --yes
          bunx wrangler triggers deploy --cwd services/www --env=""

  verify:
    needs: [release, promote]
    if: ${{ !cancelled() && needs.promote.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The environment only for its variables and secrets. deployment: false
    # keeps this read-only check out of the environment's Deployments list.
    environment:
      name: production
      deployment: false
    steps:
      - name: Verify production
        env:
          COMMIT_SHA: ${{ needs.release.outputs.commit_sha }}
          VERSION: ${{ needs.release.outputs.version }}
          API_URL: ${{ vars.HUGO_PARAMS_APIURL }}
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
        run: |
          SITE="https://gatezh.com"

          # A failed fetch fails the step (`-eo pipefail`), so no assertion
          # below can pass on an empty response. Assertions read with `<<<`,
          # not a pipe: under pipefail, `printf | grep -q` can fail on SIGPIPE
          # when grep matches early. Both helpers retry a dropped connection
          # or a 5xx a few times, so one network blip after a good deploy
          # does not fail the run; status() never retries a 4xx it reports.
          fetch() {
            curl -sf --max-time 20 --retry 3 --retry-all-errors --retry-delay 2 "$@" || { echo "::error::fetch failed: $*"; return 1; }
          }
          status() {
            curl -s -o /dev/null --max-time 20 --retry 3 --retry-all-errors --retry-delay 2 -w '%{http_code}' "$1" || true
          }

          fail=0

          # A new version takes a few seconds to reach every edge location.
          # Plain curl, not fetch: an early miss here is expected, not an error.
          for _ in 1 2 3 4 5 6; do
            deployed=$(curl -sf --max-time 20 "${SITE}/" | grep -o 'build-commit[^>]*' | grep -oE '[0-9a-f]{40}' | head -1 || true)
            [ "${deployed}" = "${COMMIT_SHA}" ] && break
            sleep 5
          done
          if [ "${deployed}" != "${COMMIT_SHA}" ]; then
            echo "::error::Deployed build-commit '${deployed}' does not match v${VERSION} (${COMMIT_SHA})"
            exit 1
          fi

          headers=$(fetch -I "${SITE}/" | tr -d '\r')

          # Production must be indexable — the inverse of staging.
          if grep -qi '^x-robots-tag:' <<< "${headers}"; then
            echo "::error::${SITE}/ sends X-Robots-Tag — production would drop out of search"
            fail=1
          fi

          grep -qi '^x-content-type-options: nosniff' <<< "${headers}" \
            || { echo "::error::${SITE}/ is missing X-Content-Type-Options: nosniff"; fail=1; }

          # The CSP comes from the generated _headers. A Transform Rule on the
          # zone that sets the same header would replace it wholesale — see
          # docs/CSP.md. connect-src must allow what the contact form POSTs to.
          csp=$(grep -i '^content-security-policy:' <<< "${headers}" || true)
          if ! grep -q "frame-ancestors 'none'" <<< "${csp}"; then
            echo "::error::${SITE}/ is not serving the site's CSP — a zone Transform Rule may be overriding it (docs/CSP.md)"
            fail=1
          elif [ -n "${API_URL}" ]; then
            api_origin=$(grep -oE '^https?://[^/]+' <<< "${API_URL}")
            grep -qE "connect-src [^;]*${api_origin}" <<< "${csp}" \
              || { echo "::error::CSP connect-src does not allow the contact API (${api_origin})"; fail=1; }
          fi

          if [ -n "${API_URL}" ]; then
            preflight=$(fetch -i -X OPTIONS -H "Origin: ${ALLOWED_ORIGIN}" -H "Access-Control-Request-Method: POST" "${API_URL}" | tr -d '\r')
            grep -qi "^access-control-allow-origin: ${ALLOWED_ORIGIN}$" <<< "${preflight}" \
              || { echo "::error::API CORS preflight did not allow ${ALLOWED_ORIGIN}"; fail=1; }
          fi

          # Unknown paths must return a real 404 (not_found_handling: 404-page),
          # never a 200 that Google files as a soft 404. /404 itself answers
          # 200; that page carries robots noindex (tests/seo.spec.ts).
          code=$(status "${SITE}/no-such-page-${GITHUB_RUN_ID}/")
          [ "${code}" = "404" ] || { echo "::error::an unknown path returned ${code}, expected 404"; fail=1; }

          # Taxonomy listings must stay out of the index.
          for path in /tags/ /categories/; do
            body=$(fetch "${SITE}${path}")
            grep -qE 'name="?robots"?[^>]*noindex' <<< "${body}" \
              || { echo "::error::${path} is missing its noindex robots meta"; fail=1; }
          done

          # A sitemap that advertises a taxonomy URL contradicts the above.
          sitemap=$(fetch "${SITE}/sitemap.xml")
          if grep -qE '<loc>[^<]*/(tags|categories)/' <<< "${sitemap}"; then
            echo "::error::sitemap.xml advertises taxonomy URLs"
            fail=1
          fi

          # Agent-facing text stays crawlable but must never be indexed —
          # otherwise every page ships a full-text duplicate at a second URL.
          # Set by their own rules in the generated _headers.
          for path in /llms.txt /llms-full.txt /index.md /about/index.md; do
            agent_headers=$(fetch -I "${SITE}${path}")
            grep -qi 'x-robots-tag: *noindex' <<< "${agent_headers}" \
              || { echo "::error::${path} is missing X-Robots-Tag: noindex"; fail=1; }
          done

          # AI crawlers must get the site — it publishes llms.txt and Markdown
          # mirrors for them. A 403 here is the zone's "Block AI bots" rule
          # (docs/seo.md, "AI crawlers: allowed").
          for bot in ClaudeBot/1.0 GPTBot/1.2 PerplexityBot/1.0 Google-Extended; do
            code=$(curl -s -o /dev/null --max-time 20 --retry 3 --retry-all-errors --retry-delay 2 -w '%{http_code}' -A "Mozilla/5.0 (compatible; ${bot})" "${SITE}/" || true)
            [ "${code}" = "200" ] || { echo "::error::${SITE}/ returned ${code} to ${bot} — the zone is blocking AI crawlers (docs/seo.md)"; fail=1; }
          done

          # robots.txt is Hugo's, granting every content signal. Cloudflare's
          # managed robots.txt would prepend Disallow rules for AI bots.
          robots=$(fetch "${SITE}/robots.txt")
          grep -q '^Content-Signal: search=yes, ai-input=yes, ai-train=yes$' <<< "${robots}" \
            || { echo "::error::robots.txt does not grant every content signal (docs/seo.md)"; fail=1; }
          if grep -qi '^Disallow:' <<< "${robots}"; then
            echo "::error::robots.txt disallows something — is Cloudflare's managed robots.txt on? (docs/seo.md)"
            fail=1
          fi

          # Zone settings that no deploy can enforce. Report, never fail.
          code=$(status http://gatezh.com/)
          [ "${code}" = "301" ] || echo "::warning::http://gatezh.com/ returned ${code}, expected 301 — turn on Always Use HTTPS"
          grep -qi '^strict-transport-security:' <<< "${headers}" \
            || echo "::warning::no Strict-Transport-Security header — enable HSTS under SSL/TLS -> Edge Certificates"

          [ "${fail}" = "0" ] || exit 1

          {
            echo "## Release v${VERSION}"
            echo ""
            echo "Deployed \`${deployed}\` to ${SITE}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Nothing rolls back on its own: a failed promote leaves at most the api newer
  # than the site (safe, see promote) and "Re-run failed jobs" finishes it; most
  # of verify's checks are zone settings a rollback cannot change. So this only
  # prints the command, however verify failed, and when promote failed or was
  # cancelled part-way (a manual cancel; the uploads must have succeeded, or
  # there is nothing to restore). www first, so a new site never meets an old
  # api.
  rollback-command:
    needs: [upload-www, upload-api, promote, verify]
    if: >-
      ${{ always()
        && needs.upload-www.result == 'success' && needs.upload-api.result == 'success'
        && (needs.promote.result == 'failure' || needs.promote.result == 'cancelled'
          || needs.verify.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Print the command that restores the previous versions
        env:
          FAILED: ${{ needs.promote.result != 'success' && 'promote' || 'verify' }}
          OUTCOME: ${{ needs.promote.result == 'cancelled' && 'was cancelled' || 'failed' }}
          WWW_PREVIOUS: ${{ needs.upload-www.outputs.previous }}
          API_PREVIOUS: ${{ needs.upload-api.outputs.previous }}
        run: |
          {
            echo "## ${FAILED} ${OUTCOME} — nothing was rolled back"
            echo ""
            if [ "${FAILED}" = "promote" ]; then
              echo "Re-running the \`promote\` job finishes the promotion, if no later run has deployed since. Or put both Workers back on what they served before this release:"
            else
              echo "If the new versions are the cause, and no later run has deployed since, put both Workers back on what they served before this release:"
            fi
            echo ""
            echo '```sh'
            echo "bunx wrangler versions deploy --cwd services/www --env=\"\" ${WWW_PREVIOUS} --yes"
            echo "bunx wrangler versions deploy --cwd services/api --env=\"\" ${API_PREVIOUS} --yes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
