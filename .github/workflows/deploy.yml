name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".github/release.yml"
      - ".devcontainer/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            services/*/node_modules
          key: node-modules-${{ hashFiles('.mise.toml', 'bun.lock', 'bunfig.toml') }}

      - name: Cache Bun global cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ hashFiles('.mise.toml', 'bun.lock', 'bunfig.toml') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

  deploy-www:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # enableGitInfo reads git history for each page's <lastmod>. On a
          # shallow clone Hugo neither warns nor errors: every page's lastmod
          # collapses to the shallow HEAD's commit date, so the whole site
          # claims to have been modified today. Full history is required.
          fetch-depth: 0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            services/*/node_modules
          key: node-modules-${{ hashFiles('.mise.toml', 'bun.lock', 'bunfig.toml') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Build Hugo site
        env:
          # Stamped into <meta name="build-commit"> so the verify job can
          # confirm the deployed artifact is this build, not a cached one.
          HUGO_PARAMS_BUILDCOMMIT: ${{ github.sha }}
        run: bun run --cwd services/www build

      - name: Deploy WWW
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/www
          packageManager: bun

  deploy-api:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            services/*/node_modules
          key: node-modules-${{ hashFiles('.mise.toml', 'bun.lock', 'bunfig.toml') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Deploy API
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/api
          packageManager: bun

  verify:
    needs: [deploy-www, deploy-api]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify deployment
        run: |
          echo "Waiting 5s for deployment to propagate..."
          sleep 5

          SITE_URL="https://gatezh.com"

          echo "Checking site at ${SITE_URL}..."
          if ! curl -sf --max-time 15 "${SITE_URL}" > /dev/null; then
            echo "Site not responding, waiting 10s and retrying..."
            sleep 10
            if ! curl -sf --max-time 15 "${SITE_URL}" > /dev/null; then
              echo "::error::Site health check failed after retry"
              exit 1
            fi
          fi
          echo "Site is responding."

      - name: Verify build provenance
        run: |
          # Confirms the deployed artifact is *this* build and not a cached or
          # partially-propagated earlier one.
          # Hugo minifies attributes and may drop quotes, so match the
          # attribute name loosely and pull the SHA out by shape.
          DEPLOYED=$(curl -sf --max-time 15 https://gatezh.com/ \
            | grep -o 'build-commit[^>]*' \
            | grep -oE '[0-9a-f]{40}' | head -1 || true)
          if [ "${DEPLOYED}" != "${GITHUB_SHA}" ]; then
            echo "::error::Deployed build-commit '${DEPLOYED}' does not match ${GITHUB_SHA}"
            exit 1
          fi
          echo "Build provenance verified: ${DEPLOYED}"

      - name: Verify indexability invariants
        run: |
          fail=0

          # Cloudflare's asset router rewrites /404.html -> /404 and would serve
          # it with a 200, making the error page an indexable URL Google files
          # as a soft 404.
          for path in /404 /404.html; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://gatezh.com${path}")
            if [ "${code}" != "404" ]; then
              echo "::error::${path} returned ${code}, expected 404"
              fail=1
            fi
          done

          # Taxonomy listings must stay out of the index.
          for path in /tags/ /categories/; do
            if ! curl -sf --max-time 15 "https://gatezh.com${path}" | grep -qE 'name="?robots"?[^>]*noindex'; then
              echo "::error::${path} is missing its noindex robots meta"
              fail=1
            fi
          done

          # A sitemap that advertises a taxonomy URL contradicts the above.
          if curl -sf --max-time 15 https://gatezh.com/sitemap.xml | grep -qE '<loc>[^<]*/(tags|categories)/'; then
            echo "::error::sitemap.xml advertises taxonomy URLs"
            fail=1
          fi

          [ "${fail}" = "0" ] && echo "Indexability invariants hold." || exit 1

      - name: Deployment summary
        env:
          # Bound as data, never interpolated into the script: a commit message
          # is untrusted input, and an apostrophe alone breaks the shell.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Escape pipes so a message containing "|" cannot break the table.
          SUBJECT=$(printf '%s' "${COMMIT_MESSAGE}" | head -1 | sed 's/|/\\|/g')
          {
            echo "## Deployment"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Commit** | [\`${GITHUB_SHA::7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |"
            echo "| **Message** | ${SUBJECT} |"
            echo "| **WWW** | https://gatezh.com |"
            echo "| **Deployed at** | $(date -u '+%Y-%m-%d %H:%M UTC') |"
          } >> "$GITHUB_STEP_SUMMARY"
