name: Outdated

# Once a month, lists the npm packages with a newer release and keeps one
# "Outdated npm dependencies" issue up to date with the list (gatezh/blog#106).
# Nothing is upgraded here: packages are pinned exactly and bumped by
# deliberate decision (.claude/CLAUDE.md), so this only makes sure someone
# looks. `bun outdated` honours bunfig.toml's minimumReleaseAge, so it never
# proposes a release younger than a week. The issue is closed when nothing is
# outdated.
#
# 10:00 UTC is 04:00 in Alberta (UTC-6 all year), an hour after upstream.yml.
on:
  schedule:
    - cron: "0 10 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  report:
    name: Report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: List outdated packages
        run: bun outdated --recursive | tee "$RUNNER_TEMP/outdated.txt"

      # Editing the body notifies nobody, so each update also leaves a comment.
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Outdated npm dependencies
        run: |
          today=$(date -u +%F)
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label dependencies \
            --search "in:title \"${TITLE}\"" --json number,title \
            --jq "map(select(.title == \"${TITLE}\"))[0].number // empty")

          if ! grep -q '^| Package' "$RUNNER_TEMP/outdated.txt"; then
            echo "Nothing is outdated." >> "$GITHUB_STEP_SUMMARY"
            if [ -n "${issue}" ]; then
              gh issue close "${issue}" --repo "$GITHUB_REPOSITORY" \
                --comment "Nothing is outdated as of ${today} ([run](${RUN_URL}))."
            fi
            exit 0
          fi

          {
            echo "\`bun outdated --recursive\` on ${today} ([run](${RUN_URL})). This issue is rewritten every month, and closed when nothing is outdated."
            echo
            echo '```'
            cat "$RUNNER_TEMP/outdated.txt"
            echo '```'
            echo
            echo "Bump on a branch with \`bun add <pkg>@<version>\` (bunfig.toml pins it exactly; a catalog entry is bumped in the root package.json), then run \`bun run check\` and \`bun run test\`. A security fix that cannot wait for the 7-day gate: see bunfig.toml."
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${issue}" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "${TITLE}" --label dependencies --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue edit "${issue}" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
            gh issue comment "${issue}" --repo "$GITHUB_REPOSITORY" --body "Updated for ${today} ([run](${RUN_URL}))."
          fi

  # Community keepalive against the 60-day schedule disable (not documented
  # by GitHub), as in upstream.yml. A separate job so only it holds
  # `actions: write`.
  keepalive:
    name: Keep the schedule alive
    needs: report
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/outdated.yml/enable"
