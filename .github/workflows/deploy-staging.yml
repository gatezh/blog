name: Deploy (staging)

# Every push to master deploys staging. Production deploys only through
# release.yml.
on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".github/release.yml"
      - ".github/dependabot.yml"
      - ".devcontainer/**"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running deploy: that can leave www and api on different
# commits. GitHub keeps one pending run and replaces it when a newer push
# arrives. That is what staging wants: the pending run never started a job, and
# the newer commit already contains it. Keyed by ref: a dispatch from another
# branch joins its group before the environment's branch policy refuses its
# jobs, and in a shared group it would replace a waiting master deploy and then
# do nothing.
concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: false

# An explicit `bash` runs `bash -eo pipefail`; the implicit default is
# `bash -e` alone, which lets a failed curl hide behind a later pipe stage.
defaults:
  run:
    shell: bash

jobs:
  # Before CI or anything else: the deploy configuration, and whether a pull
  # request run already tested this exact tree.
  preflight:
    # bash, jq and gh only: the single-CPU runner is enough (15-minute cap).
    runs-on: ubuntu-slim
    timeout-minutes: 5
    # Variables and secrets only; the Deployments record belongs to go-live.
    environment:
      name: staging
      deployment: false
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      # `$/` loads the action from this workflow's own commit, so it needs no checkout.
      - uses: $/.github/actions/check-deploy-config
        with:
          environment: staging
        env:
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
          HUGO_PARAMS_APIURL: ${{ vars.HUGO_PARAMS_APIURL }}
          HUGO_PARAMS_TURNSTILESITEKEY: ${{ vars.HUGO_PARAMS_TURNSTILESITEKEY }}
          HAS_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY != '' }}
          HAS_TO_EMAIL: ${{ secrets.TO_EMAIL != '' }}
          HAS_FROM_EMAIL: ${{ secrets.FROM_EMAIL != '' }}
          HAS_TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY != '' }}

      # ci.yml's lint job records each pull request run's tree. A merge commit
      # with the same tree has the same files, so it needs no second CI run.
      # Only runs from this repo's own branches count: a fork's pull request
      # runs the fork's ci.yml, which can upload a marker for any tree.
      - name: Find a passing pull request run of this tree
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tree=$(gh api "repos/${REPO}/git/commits/${GITHUB_SHA}" --jq .tree.sha)
          runs=$(gh api "repos/${REPO}/actions/artifacts?name=tested-tree-${tree}&per_page=100" --jq '.artifacts[] | select(.expired | not) | .workflow_run.id // empty')
          for id in ${runs}; do
            run=$(gh api "repos/${REPO}/actions/runs/${id}" --jq 'select(.conclusion == "success" and .event == "pull_request" and .path == ".github/workflows/ci.yml" and .head_repository.id == .repository.id) | .html_url')
            if [ -n "${run}" ]; then
              echo "::notice::Skipping CI: tree ${tree::7} passed in ${run}"
              echo "CI skipped: this tree (\`${tree::7}\`) already passed in [its pull request run](${run})." >> "$GITHUB_STEP_SUMMARY"
              echo "run=${run}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No passing pull request run tested tree ${tree::7}; running CI." | tee -a "$GITHUB_STEP_SUMMARY"

  ci:
    needs: preflight
    if: needs.preflight.outputs.run == ''
    uses: $/.github/workflows/ci.yml

  # Same two phases as release.yml: upload both services as versions that serve
  # no traffic, then go-live promotes both. See the comment above `upload` there.
  upload:
    needs: [preflight, ci]
    # After CI passed, or was skipped by preflight; never when preflight failed.
    if: >-
      ${{ !cancelled() && needs.preflight.result == 'success'
        && (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && needs.preflight.outputs.run != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      deployment: false
    outputs:
      www_version: ${{ steps.www.outputs.version_id }}
      api_version: ${{ steps.api.outputs.version_id }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # enableGitInfo reads git history for each page's <lastmod>. On a
          # shallow clone every lastmod collapses to the shallow HEAD's commit
          # date, so the whole site claims to have been modified today.
          fetch-depth: 0
      - uses: $/.github/actions/setup

      - name: Build Hugo site
        env:
          # Not production: the generated _headers gains X-Robots-Tag: noindex,
          # which is what keeps staging out of search results
          # (services/www/layouts/home._outputformat_headers_.txt).
          HUGO_ENVIRONMENT: staging
          HUGO_BASEURL: ${{ vars.HUGO_BASEURL }}
          HUGO_PARAMS_APIURL: ${{ vars.HUGO_PARAMS_APIURL }}
          HUGO_PARAMS_TURNSTILESITEKEY: ${{ vars.HUGO_PARAMS_TURNSTILESITEKEY }}
          HUGO_PARAMS_BUILDCOMMIT: ${{ github.sha }}
        run: |
          # hugo.yaml's baseURL is localhost on purpose; a deploy without the
          # override would ship every canonical, sitemap and JSON-LD URL wrong.
          : "${HUGO_BASEURL:?Set HUGO_BASEURL on the staging environment}"
          bun run --cwd services/www build

      # The secrets go up in the same Worker version as the code (`versions
      # upload --secrets-file`), not as a separate `wrangler secret bulk`
      # deployment of the old code first. Every credential is a secret, so its
      # value is masked in this public repo's logs. Unset ones are left out
      # rather than shipped as an empty string that reads as "configured". The
      # file lives in RUNNER_TEMP and is deleted after the upload.
      - name: Write the secrets file
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: |
          umask 077
          jq -n 'env | {RESEND_API_KEY, TURNSTILE_SECRET_KEY, TO_EMAIL, FROM_EMAIL}
            | with_entries(select(.value != null and .value != ""))' > "${RUNNER_TEMP}/secrets.json"

      - name: Upload api as a new version
        id: api
        working-directory: services/api
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-api.json
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
        run: |
          bunx wrangler versions upload --env staging \
            --secrets-file "${RUNNER_TEMP}/secrets.json" \
            --var "ALLOWED_ORIGIN:${ALLOWED_ORIGIN}" \
            --message "${GITHUB_SHA}"
          id=$(jq -r 'select(.type == "version-upload") | .version_id // empty' "${WRANGLER_OUTPUT_FILE_PATH}")
          [ -n "${id}" ] || { echo "::error::wrangler reported no version id"; exit 1; }
          echo "version_id=${id}" >> "$GITHUB_OUTPUT"

      - name: Delete the secrets file
        if: always()
        run: rm -f "${RUNNER_TEMP}/secrets.json"

      - name: Upload www as a new version
        id: www
        working-directory: services/www
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-www.json
        run: |
          # The commit, on the Worker version, so the dashboard's Deployments
          # list says what each version is.
          bunx wrangler versions upload --env staging --message "${GITHUB_SHA}"
          id=$(jq -r 'select(.type == "version-upload") | .version_id // empty' "${WRANGLER_OUTPUT_FILE_PATH}")
          [ -n "${id}" ] || { echo "::error::wrangler reported no version id"; exit 1; }
          echo "version_id=${id}" >> "$GITHUB_OUTPUT"

  # Stages both new versions at 0% beside the live ones, checks them through a
  # version override on the real hostnames, then promotes them (api first).
  # The only job that changes what staging serves, and visitors see no change
  # before the promote. Same design as release.yml; the shared steps are the
  # go-live action (.github/actions/go-live/go-live.sh).
  # https://developers.cloudflare.com/workers/versions-and-deployments/version-overrides/
  go-live:
    needs: upload
    # Stated outright: a skipped ci above would otherwise skip this job too.
    if: ${{ !cancelled() && needs.upload.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging-www.gatezh.com
    # What the go-live action reads (go-live.sh lists it).
    env:
      WRANGLER_ENV: staging
      # wrangler.jsonc's names plus "-staging": an env block appends its name.
      API_WORKER: gatezh-com-email-worker-staging
      WWW_WORKER: gatezh-com-staging
      API_VERSION_ID: ${{ needs.upload.outputs.api_version }}
      WWW_VERSION_ID: ${{ needs.upload.outputs.www_version }}
      WWW_URL: https://staging-www.gatezh.com
      API_URL: https://staging-api.gatezh.com
      EXPECT_COMMIT: ${{ github.sha }}
      DEPLOY_LABEL: staging
      DEPLOY_MESSAGE: ${{ github.sha }}
      # Optional: only needed once staging-www sits behind Cloudflare Access.
      CLOUDFLARE_ZERO_CLIENT_ID: ${{ vars.CLOUDFLARE_ZERO_CLIENT_ID }}
      CLOUDFLARE_ZERO_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ZERO_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup

      # Reads what is live here, not in upload: re-running go-live on an older
      # run (the rollback) must stage beside today's versions.
      - name: Stage both versions at 0% of traffic
        id: stage
        uses: $/.github/actions/go-live
        with:
          command: stage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # A missed override reaches the live versions without an error, so
      # nothing is checked until both staged versions answer.
      - name: Wait until the override reaches both staged versions
        id: reach
        uses: $/.github/actions/go-live
        with:
          command: wait

      # Every request carries the headers that reached the staged versions.
      - name: Verify the staged versions
        env:
          HEADERS: ${{ steps.reach.outputs.headers }}
          # What the contact form was built to POST to; the CSP's connect-src
          # must allow its origin.
          FORM_API_URL: ${{ vars.HUGO_PARAMS_APIURL }}
        run: |
          # A failed fetch fails the step (`-eo pipefail`), so no assertion
          # below can pass on an empty response. Assertions read with `<<<`,
          # not a pipe: under pipefail, `printf | grep -q` can fail on SIGPIPE
          # when grep matches early. Both helpers retry a dropped connection
          # or a 5xx a few times, so one network blip after a good deploy
          # does not fail the run; status() never retries a 4xx it reports.
          fetch() {
            curl -sf --max-time 20 --retry 3 --retry-all-errors --retry-delay 2 -H @"${HEADERS}" "$@" || { echo "::error::fetch failed: $*"; return 1; }
          }
          status() {
            curl -s -o /dev/null --max-time 20 --retry 3 --retry-all-errors --retry-delay 2 -w '%{http_code}' -H @"${HEADERS}" "$1" || true
          }

          fail=0

          headers=$(fetch -I "${WWW_URL}/" | tr -d '\r')

          # Staging must never be indexed: its pages are self-canonical copies
          # of production. The staging build adds it to the generated _headers.
          grep -qi '^x-robots-tag: noindex' <<< "${headers}" \
            || { echo "::error::${WWW_URL}/ is missing X-Robots-Tag: noindex"; fail=1; }

          grep -qi '^x-content-type-options: nosniff' <<< "${headers}" \
            || { echo "::error::${WWW_URL}/ is missing X-Content-Type-Options: nosniff"; fail=1; }

          # The CSP comes from the generated _headers. A Transform Rule matching
          # this host would silently replace it — that is what this checks.
          csp=$(grep -i '^content-security-policy:' <<< "${headers}" || true)
          if ! grep -q "frame-ancestors 'none'" <<< "${csp}"; then
            echo "::error::${WWW_URL}/ is not serving the site's CSP (services/www/layouts/home._outputformat_headers_.txt)"
            fail=1
          elif [ -n "${FORM_API_URL}" ]; then
            api_origin=$(grep -oE '^https?://[^/]+' <<< "${FORM_API_URL}")
            grep -qE "connect-src [^;]*${api_origin}" <<< "${csp}" \
              || { echo "::error::CSP connect-src does not allow the contact API (${api_origin})"; fail=1; }
          fi

          code=$(status "${WWW_URL}/no-such-page-${GITHUB_RUN_ID}/")
          [ "${code}" = "404" ] || { echo "::error::an unknown path returned ${code}, expected 404"; fail=1; }

          # Agent-facing text must be noindex. On staging the site-wide rule
          # also covers it; release.yml checks its own rules on production.
          for path in /llms.txt /about/index.md; do
            agent_headers=$(fetch -I "${WWW_URL}${path}" | tr -d '\r')
            grep -qi '^x-robots-tag: noindex' <<< "${agent_headers}" \
              || { echo "::error::${WWW_URL}${path} is missing X-Robots-Tag: noindex"; fail=1; }
          done

          # CORS preflight from the staging origin must be allowed, and echo it.
          preflight=$(fetch -i -X OPTIONS -H "Origin: ${WWW_URL}" -H "Access-Control-Request-Method: POST" "${API_URL}/" | tr -d '\r')
          grep -qi "^access-control-allow-origin: ${WWW_URL}$" <<< "${preflight}" \
            || { echo "::error::API CORS preflight did not allow ${WWW_URL}"; fail=1; }

          # Googlebot crawls the API host too: GET / must be 200 + noindex.
          api_headers=$(fetch -i "${API_URL}/" | tr -d '\r')
          head -1 <<< "${api_headers}" | grep -q ' 200' \
            || { echo "::error::GET ${API_URL}/ did not return 200"; fail=1; }
          grep -qi '^x-robots-tag: noindex' <<< "${api_headers}" \
            || { echo "::error::GET ${API_URL}/ is missing X-Robots-Tag: noindex"; fail=1; }

          [ "${fail}" = "0" ] || exit 1
          echo "The staged versions passed every check."

      - name: Promote both versions to all traffic
        id: promote
        uses: $/.github/actions/go-live
        with:
          command: promote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Say what is live and how to restore it
        if: failure() || cancelled()
        uses: $/.github/actions/go-live
        with:
          command: restore
        env:
          PROMOTE: ${{ steps.promote.outcome }}
          WWW_LIVE: ${{ steps.stage.outputs.www-live }}
          API_LIVE: ${{ steps.stage.outputs.api-live }}
