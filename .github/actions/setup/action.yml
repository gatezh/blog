name: Set up Bun and dependencies
description: >-
  Installs the tools pinned in .mise.toml (Bun, Hugo) and the workspace's
  dependencies from bun.lock. The calling job checks the repository out first,
  so this file exists.

runs:
  using: composite
  steps:
    # mise itself is not pinned. The action installs the newest release that
    # has been public for 7 days, like bunfig.toml's gate (the default is
    # 24h), and refuses it unless it matches the signed packslip mise's
    # release workflow publishes for that tag. The tools stay pinned in
    # .mise.toml.
    - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      with:
        minimum_release_age: 7d

    # Bun's download cache, not node_modules (actions/cache advises against
    # caching node_modules). The install therefore always runs and links from
    # this cache, so what a job builds is always exactly what bun.lock says.
    - name: Cache Bun's package cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('.mise.toml', 'bun.lock', 'bunfig.toml') }}
        restore-keys: |
          bun-${{ runner.os }}-

    # `bun ci` is Bun's documented equivalent of `bun install
    # --frozen-lockfile`: it fails if package.json and bun.lock disagree.
    - name: Install dependencies
      shell: bash
      run: bun ci
